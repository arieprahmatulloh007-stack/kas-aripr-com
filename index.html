<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KAS ARIP R.COM</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<script>

if(localStorage.getItem('login') != 'true'){

   window.location='login.html';
}

</script>

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

   <h2>

      <i class="fa-solid fa-wallet"></i>

      <span>

         KAS ARIP<br>
         R.COM

      </span>

   </h2>

   <button onclick="showPage('dashboard')">
      Dashboard
   </button>

   <button onclick="showPage('kas')">
      Uang Kas
   </button>

   <button onclick="showPage('pinjaman')">
      Pinjaman
   </button>

   <button onclick="showPage('cicilan')">
      Cicilan
   </button>

   <hr>

   <button onclick="showPage('teknisi')">
      Data Teknisi
   </button>

   <button onclick="showPage('uploadGaji')">
      Upload Gaji
   </button>

   <button onclick="showPage('monitoringGaji')">
      Monitoring Gaji
   </button>

   <button onclick="showPage('slipGaji')">
      Slip Gaji
   </button>

   <br>

   <button onclick="logout()">
      Logout
   </button>

</div>

<!-- =========================
     CONTENT
========================= -->

<div class="content">

<!-- =========================
     DASHBOARD
========================= -->

<div id="dashboard" class="page">

   <h1>Dashboard</h1>

   <div class="cards">

      <div class="card">
         <h3>Total Uang Masuk</h3>
         <p id="totalMasuk">Rp 0</p>
      </div>

      <div class="card">
         <h3>Total Uang Keluar</h3>
         <p id="totalKeluar">Rp 0</p>
      </div>

      <div class="card">
         <h3>Sisa Uang Kas</h3>
         <p id="sisaKas">Rp 0</p>
      </div>

      <div class="card">
         <h3>Total Pinjaman</h3>
         <p id="totalPinjaman">Rp 0</p>
      </div>

      <div class="card">
         <h3>Sisa Piutang</h3>
         <p id="sisaPiutang">Rp 0</p>
      </div>

   </div>

   <div class="chart-box">

      <canvas id="myChart"></canvas>

   </div>

   <div class="card">

      <h3>Belum Lunas Pinjaman / Kasbon</h3>

      <div id="belumLunasList"></div>

   </div>

   <div class="payroll-dashboard">

   <div class="dashboard-grid">

      <div class="dashboard-box">

         <h3>Total Gaji Periode</h3>

         <canvas id="chartGaji"></canvas>

      </div>

      <div class="dashboard-box">

         <h3>Total SC Periode</h3>

         <canvas id="chartSC"></canvas>

      </div>

   </div>

   <div class="dashboard-box">

      <h3>Total Gaji Periode</h3>
      <h3>Ranking Teknisi Payroll</h3>

      <div id="dashboardPeriodeGaji"></div>
      <div id="dashboardTeknisiPayroll"></div>

   </div>

</div>

   <div class="dashboard-box">

      <h3>Total SC Periode</h3>

      <div id="dashboardPeriodeSC"></div>

   </div>

   <div class="dashboard-box">

      <h3>Ranking Teknisi Payroll</h3>

      <div id="dashboardTeknisiPayroll"></div>

   </div>

</div>

</div>

<!-- =========================
     UANG KAS
========================= -->
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
