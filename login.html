<!DOCTYPE html>
      <div class="login-box">

         <div class="logo-icon">
            <i class="fa-solid fa-building-columns"></i>
         </div>

         <h2>
         Welcome Back
         </h2>

         <p class="subtitle">
         Login untuk melanjutkan ke dashboard
         </p>

         <div class="input-group">

            <i class="fa-solid fa-user"></i>

            <input
            type="text"
            id="username"
            placeholder="Username">

         </div>

         <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="password"
            placeholder="Password">

         </div>

         <button
         class="login-btn"
         onclick="login()">

         <i class="fa-solid fa-right-to-bracket"></i>
         Login Sekarang

         </button>

         <div class="copyright">
            © 2026 KAS ARIP R.COM
         </div>

      </div>

   </div>

</div>

<script src="login.js"></script>

</body>
</html>
